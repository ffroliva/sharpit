# SonarCloud: analysed by the `sonar` job in .github/workflows/ci.yml (CI-based analysis;
# Automatic Analysis must be off in the SonarCloud project settings).
sonar.projectKey=ffroliva_sharpit
sonar.organization=ffroliva-github

# Production code: the Python package and the Svelte UI source. The built bundle is generated.
sonar.sources=src,ui/src
sonar.tests=tests,ui/tests
sonar.exclusions=src/sharpit/ui/static/**
sonar.python.version=3.12,3.13,3.14
sonar.sourceEncoding=UTF-8

# Python coverage from pytest-cov. The UI has no coverage report yet, so it is left out of the metric
# (still analysed for bugs, vulnerabilities and smells).
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=ui/**

# Fail the CI step when the quality gate fails, instead of reporting it later on the dashboard.
sonar.qualitygate.wait=true
