name: dco

# The pull request is data only. pull_request_target runs with the base repository's token, so this workflow checks
# out the base branch (no ref), never runs code from the pull request, and passes every value through env.
# zizmor dangerous-triggers: ignored for that reason; pull_request would run the pull request's own copy of the check.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Signed-off-by trailers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/dco_check.py
