name: ci
on:
  push:
    branches: [main, mvp]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_EVENT_NAME" != push ]] || [[ -z "$BASE" || -z "$HEAD" || "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif grep -Ev '(^website/|\.md$)' <<< "$changed" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    # ruff, format, pyright and the mirror-link grep are version-independent (pyright pins 3.12): one job, in parallel
    # with the test shards, so no shard carries lint on its critical path.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.12 # NOSONAR - installs sharpit from source; pyright resolves it
      - run: uv run --no-sync ruff check
      - run: "! git grep -n 'cloud[n]s' -- ." # links must point at github.com, never a mirror
        shell: bash
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyright

  # The suite runs split by test file (SHARPIT_SHARD=i/n, tests/_shard.py): 4 shards a leg, because the costliest shard
  # sets the leg's wall (the ceiling is pinned in tests/test_ci_layout.py).
  # Each leg's shards together run every test exactly once (tests/test_shard.py).
  test-shard:
    name: test shard (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", shard: 1/5 }
          - { os: ubuntu-latest, python: "3.12", shard: 2/5 }
          - { os: ubuntu-latest, python: "3.12", shard: 3/5 }
          - { os: ubuntu-latest, python: "3.12", shard: 4/5 }
          - { os: ubuntu-latest, python: "3.12", shard: 5/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 1/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 2/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 3/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 4/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 5/5 }
          - { os: ubuntu-latest, python: "3.14", shard: 1/5 }
          - { os: ubuntu-latest, python: "3.14", shard: 2/5 }
          - { os: ubuntu-latest, python: "3.14", shard: 3/5 }
          - { os: ubuntu-latest, python: "3.14", shard: 4/5 }
          - { os: ubuntu-latest, python: "3.14", shard: 5/5 }
          - { os: windows-latest, python: "3.14", shard: 1/4 }
          - { os: windows-latest, python: "3.14", shard: 2/4 }
          - { os: windows-latest, python: "3.14", shard: 3/4 }
          - { os: windows-latest, python: "3.14", shard: 4/4 }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra test --python ${{ matrix.python }} # NOSONAR - installs sharpit from source for the test suite; --no-build would prevent that
      - run: uv run pytest -q -n auto --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: # per-file timings: pytest-speed's `rank` and the shard weights (tests/shard_weights.json) read these
          name: junit-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  test:
    # The required checks keep their names: each passes only when every test shard passed (always(): a skipped
    # required check would count as green). Stricter than per leg: one failed shard, or lint, fails all four.
    needs: [test-shard, lint, changes]
    if: always()
    strategy:
      fail-fast: false # each required check reports, none shows as cancelled
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.test-shard.result }}" = success && test "${{ needs.lint.result }}" = success

  coverage-shard:
    # Coverage for SonarCloud. Overhead budget tests time capture on vs off, which the coverage tracer distorts:
    # tests/overhead.py::paired skips every one of them while a tracer runs; the plain test matrix above enforces them.
    name: coverage shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.13 # NOSONAR - installs sharpit from source for coverage; --no-build would prevent that
      # coverage's per-worker data files would land in the repo, which the side-effect checks report as a change
      - env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          COVERAGE_CORE: sysmon # sys.monitoring tracer (Python 3.12+): same report, a fraction of the classic tracer's cost
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
        run: uv run pytest -q -n auto --cov=sharpit --cov-report= --junitxml="${{ runner.temp }}/junit.xml"
      - run: cp "$RUNNER_TEMP/.coverage" "coverage-${{ strategy.job-index }}.data" # a visible name: upload skips dotfiles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: coverage-${{ strategy.job-index }}.data
          retention-days: 1

  coverage:
    # Combines the shards' data into the coverage.xml sonar reads; required check, fails unless every shard passed.
    needs: [coverage-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; coverage check is a no-op."
      - if: needs.changes.outputs.code != 'false'
        run: test "${{ needs.coverage-shard.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code != 'false'
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked --extra test --python 3.13 # NOSONAR - the report reads sharpit's sources and coverage's config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - if: needs.changes.outputs.code != 'false'
        run: uv run --no-sync coverage combine coverage-*.data && uv run --no-sync coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  sonar:
    needs: [coverage, changes]
    runs-on: ubuntu-latest
    # always(): report change-detection and coverage failures in this required check too.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; Sonar check is a no-op."
      - if: needs.changes.outputs.code != 'false'
        run: test "${{ needs.coverage.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
          fetch-depth: 0 # blame and new-code detection need full history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: coverage-xml
      - name: Read project version
        id: version
        if: needs.changes.outputs.code != 'false'
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/sharpit/__init__.py').read()).group(1))")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check SonarCloud availability
        id: health
        if: needs.changes.outputs.code != 'false'
        run: |
          if curl -sf -m 10 https://sonarcloud.io/api/system/status | grep -q '"status":"UP"'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarCloud is unreachable; scan skipped for this run (not a code failure)."
          fi
      - name: SonarCloud scan
        if: >-
          needs.changes.outputs.code != 'false' && steps.health.outputs.up == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Sonar ratchet (no new issues; main never above sonar-baseline.txt)
        if: >-
          needs.changes.outputs.code != 'false' && steps.health.outputs.up == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            python scripts/ci/sonar_ratchet.py --pull-request "$PR"
          else
            python scripts/ci/sonar_ratchet.py --branch "$GITHUB_REF_NAME"
          fi

  lowest-shard:
    name: lowest shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --extra test --no-dev --resolution lowest-direct --python 3.12 # NOSONAR - deliberately resolves lowest-direct without the lock and installs sharpit from source
      # --no-sync: a plain `uv run` re-syncs to uv.lock and undoes the lowest resolution
      - run: uv run --no-sync pytest -q -n auto --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-lowest-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-lowest-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  lowest:
    # required check: passes only when every lowest shard passed (always(): a skipped required check counts as green)
    needs: [lowest-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.lowest-shard.result }}" = success

  no-sqlalchemy-shard:
    # SQLAlchemy is optional: sharpit must install, import and serve every panel without it
    name: no-sqlalchemy shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: >-
          uv sync --locked --extra test --no-install-package sqlalchemy --no-install-package aiosqlite
          --no-install-package alembic --no-install-package greenlet # NOSONAR - this job installs sharpit from source and excludes optional dependencies
      - run: uv run --no-sync pytest -q -n auto -m "not needs_sqlalchemy" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-no-sqlalchemy-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-no-sqlalchemy-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  no-sqlalchemy:
    # required check: passes only when every no-sqlalchemy shard passed (always(): a skipped required check counts as green)
    needs: [no-sqlalchemy-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.no-sqlalchemy-shard.result }}" = success

  masking-gates:
    # The four files that outweigh any shard ceiling alone, every row: test_masking_scales_linearly.py (487 s of CPU
    # time on Linux), test_statement_surfaces.py (386 s on Windows), test_lane_gate.py (418 s on Windows) and
    # test_gates_bite.py (488 s on Windows, 279 s on Linux). The shards leave them out (tests/_shard.py OWN_JOB) and
    # this job runs them whole. No job timeout is set, so GitHub's 6 h default covers them.
    name: masking gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked --extra test --python 3.14 # NOSONAR - installs sharpit from source for the gate
      - run: uv run --no-sync pytest tests/masking/test_masking_scales_linearly.py tests/masking/test_statement_surfaces.py tests/scripts/test_lane_gate.py tests/masking/test_gates_bite.py -q -n auto --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: # ci_review.py globs junit-*
          name: junit-masking-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-masking-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  masking-gates-check:
    # required check, as `test` is for the shards (always(): a skipped required check counts as green)
    needs: [masking-gates, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.masking-gates.result }}" = success

  live:
    name: live (${{ matrix.server }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: mysql84, image: mysql:8.4.10, port: 3306, filter: "mysql84 and not wrong_wired or wrong_wired", legs: "mysql84-default=2150 mysql84-NO_BACKSLASH_ESCAPES=2150 mysql84-ANSI_QUOTES=1388", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_a_wrong_wired_dialect_fails_the_oracle=1" }
          - { server: mysql80, image: mysql:8.0.44, port: 3306, filter: mysql80, legs: "mysql80-default=1995 mysql80-NO_BACKSLASH_ESCAPES=1995 mysql80-ANSI_QUOTES=1233", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row" }
          - { server: mariadb, image: mariadb:12.3.3, port: 3306, filter: "mariadb or oracle_control and backslash and mysql or oracle_control and mssql", legs: "mariadb-default=1996 mariadb-NO_BACKSLASH_ESCAPES=1996 mariadb-ANSI_QUOTES=1233 mariadb-MSSQL=1403 mariadb-ORACLE=1233", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_oracle_control=3" }
          - { server: postgresql, image: postgres:18.2, port: 5432, filter: "postgresql or scs_off_no_cut or inverse_plant", legs: "postgresql-on=138 postgresql-off=138", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_oracle_control=3 test_example_app_records_its_server_family=1 test_the_inverse_plant_shows_five_rows_on_off=1" }
          - { server: controls, image: mysql:8.4.10, port: 3306, filter: "sqlite or test_example_app_records_its_server_family and mysql", legs: "sqlite-default=2817", required: "test_example_app_records_its_server_family=1 test_a_refused_statement_keeps_its_value_hidden=1" }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: ${{ matrix.image }}
        options: >-
          --health-cmd "${{ matrix.server == 'mariadb' && 'healthcheck.sh --connect --innodb_initialized' || matrix.server == 'postgresql' && 'pg_isready -U postgres' || 'mysqladmin ping -h 127.0.0.1 -psharpit' }}"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: sharpit
          MYSQL_DATABASE: sharpit
          MARIADB_ROOT_PASSWORD: sharpit
          MARIADB_DATABASE: sharpit
          POSTGRES_PASSWORD: sharpit
          POSTGRES_DB: sharpit
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra test --python 3.14 # NOSONAR - installs sharpit from source for the live tests
      - run: uv pip install asyncpg aiomysql
      - run: uv run --no-sync pytest tests/live --live -n auto -k "$LIVE_FILTER" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          LIVE_FILTER: ${{ matrix.filter }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
          SHARPIT_LIVE_MYSQL84_URL: ${{ (matrix.server == 'mysql84' || matrix.server == 'controls') && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_MYSQL80_URL: ${{ matrix.server == 'mysql80' && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_MARIADB_URL: ${{ matrix.server == 'mariadb' && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_POSTGRESQL_URL: ${{ matrix.server == 'postgresql' && format('postgresql+psycopg://postgres:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
      - name: Require executed live tests, without skips
        if: always()
        env:
          LEGS: ${{ matrix.legs }}
          REQUIRED_LIVE: ${{ matrix.required }}
        run: uv run --no-sync python scripts/ci/check_live_tests.py "$RUNNER_TEMP/junit.xml" --legs $LEGS --require $REQUIRED_LIVE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-live-${{ matrix.server }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-live-${{ matrix.server }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  sharpit-gate:
    # Dogfood: the example's fixed route must pass `pytest --sharpit`, its planted N+1 must fail it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.13 # NOSONAR - installs sharpit from source for the gate
      - run: uv run --no-sync pytest examples/fastapi_sqla/tests_gate -k fixed --sharpit --sharpit-junit=sharpit-junit.xml --junitxml="${{ runner.temp }}/junit-fixed.xml"
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-sharpit-gate-fixed
          path: ${{ runner.temp }}/junit-fixed.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sharpit-gate-reports
          path: |
            sharpit-report.json
            sharpit-junit.xml
          retention-days: 7
      - name: The planted N+1 must fail the gate
        run: "! uv run --no-sync pytest examples/fastapi_sqla/tests_gate -k n_plus_one --sharpit --sharpit-report=planted-report.json --junitxml=\"$RUNNER_TEMP/junit-planted.xml\""
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-sharpit-gate-planted
          path: ${{ runner.temp }}/junit-planted.xml
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-sharpit-gate-single
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7

  ui:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; UI check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: 22
      - if: needs.changes.outputs.code != 'false'
        run: npm ci --ignore-scripts && npm run build
      - if: needs.changes.outputs.code != 'false'
        run: git diff --exit-code -- ../src/sharpit/ui/static

  vitest:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; Vitest check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: 22
      - if: needs.changes.outputs.code != 'false'
        run: npm ci --ignore-scripts && npm test

  wheel:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; wheel check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - name: main never tracks .superpowers/ (harvest into docs/reports/ first)
        if: needs.changes.outputs.code != 'false' && github.base_ref == 'main'
        run: python3 scripts/ci/no_superpowers.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code != 'false'
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - if: needs.changes.outputs.code != 'false'
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - if: needs.changes.outputs.code != 'false'
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/sharpit-*.whl fastapi pydantic-settings uvicorn httpx
          PYTHONPATH=. "$RUNNER_TEMP/smoke/bin/python" scripts/ci/wheel_smoke.py

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor@1.32.0 --offline --min-severity medium .github/workflows
