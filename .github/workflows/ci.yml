      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed-budgets.outcome == 'success'
        with:
          name: speed-lowest-shard-budgets
