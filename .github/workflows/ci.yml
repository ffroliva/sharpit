          if-no-files-found: ignore
          retention-days: 7

  lowest:
    # required check: passes only when every lowest shard passed (always(): a skipped required check counts as green)
    needs: [lowest-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.lowest-shard.result }}" = success

  no-sqlalchemy-shard:
    # SQLAlchemy is optional: sharpit must install, import and serve every panel without it
    name: no-sqlalchemy shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: >-
          uv sync --locked --extra test --no-install-package sqlalchemy --no-install-package aiosqlite
          --no-install-package alembic --no-install-package greenlet # NOSONAR - this job installs sharpit from source and excludes optional dependencies
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python scripts/ci/timing_files.py "${{ runner.temp }}" # budgets.args, no-budgets.args
      - run: uv run --no-sync python -m pytest -q -n auto "@${{ runner.temp }}/no-budgets.args" -m "not needs_sqlalchemy" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
