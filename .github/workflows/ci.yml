name: ci
on:
  push:
    branches: [main, mvp, "release/**"]
  pull_request:
  workflow_dispatch:

# zizmor cache-poisoning (owner ruling 2026-11-12): ignored on each cache step below. This workflow publishes
# nothing, and GitHub scopes caches so a pull request's cache is never restored by a push run on main, mvp or
# release/**; the audit fires because release/** is a push trigger.

permissions:
  contents: read

# A new push to a PR cancels its superseded run. Every push gets its own group (run_id): GitHub cancels a run
# waiting in a group even without cancel-in-progress, so a shared group would drop and serialise main's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_EVENT_NAME" != push ]] || [[ -z "$BASE" || -z "$HEAD" || "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif grep -Ev '(^website/|\.md$)' <<< "$changed" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The suite runs split by test file (SHARPIT_SHARD=i/n, tests/_shard.py): 4 shards an Ubuntu leg, 6 on Windows (its
  # tests run ~1.45x slower), because the costliest shard sets the leg's wall (ceiling: tests/test_ci_layout.py).
  # Each leg's shards together run every test exactly once (tests/test_shard.py).
  # On a pull request this job is the Windows 3.14 leg, the long pole, so it asks the 20-runner pool for a slot first.
  # The locked-deps Ubuntu 3.12 and 3.14 legs are test-shard-locked: the same steps, push and dispatch only (owner
  # decision 2026-11-12). A PR still runs every Python (3.12 in lowest, 3.13 in coverage-shard, 3.14 here) and both OSes.
  test-shard:
    name: test shard (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.14", shard: 1/6 }
          - { os: windows-latest, python: "3.14", shard: 2/6 }
          - { os: windows-latest, python: "3.14", shard: 3/6 }
          - { os: windows-latest, python: "3.14", shard: 4/6 }
          - { os: windows-latest, python: "3.14", shard: 5/6 }
          - { os: windows-latest, python: "3.14", shard: 6/6 }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra test ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--group full-extras' || '' }} --python ${{ matrix.python }} # NOSONAR - installs sharpit from source for the test suite; --no-build would prevent that
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python scripts/ci/timing_files.py "${{ runner.temp }}" # budgets.args, no-budgets.args
      - run: uv run python -m pytest -q -n auto "@${{ runner.temp }}/no-budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with: # per-file timings: pytest-speed's `rank` and the shard weights (tests/shard_weights.json) read these
          name: junit-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7
      # The budget tests alone (-n 0) after the parallel step, which ignores them: next to xdist workers still
      # draining they fail on CI only. No SHARPIT_SHARD (each runs once, here) and no coverage (the tracer skips them).
      - if: ${{ !cancelled() && (matrix.shard == '4/4' || matrix.shard == '6/6') }}
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead-budgets.jsonl
        run: uv run --no-sync python -m pytest -q -n 0 "@${{ runner.temp }}/budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft-budgets.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb-budgets.json" --junitxml="${{ runner.temp }}/junit-budgets.xml"
      - id: scan-junit-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-budgets.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-budgets.outcome == 'success'
        with:
          name: junit-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/junit-budgets.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead-budgets.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead-budgets.outcome == 'success'
        with:
          name: overhead-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/overhead-budgets.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed-budgets.outcome == 'success'
        with:
          name: speed-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/speed/*-budgets.*
          if-no-files-found: ignore
          retention-days: 7

  coverage-shard:
    # The 3.13 leg of the suite, run once under coverage for SonarCloud. Overhead budget tests time capture on vs off,
    # which the coverage tracer distorts: tests/overhead.py::paired skips their budget assertions while a tracer runs, so
    # the 5/5 row reruns the budget files (tests/_shard.py timing_files) without coverage to keep them enforced on 3.13.
    name: test shard (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13", shard: 1/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 2/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 3/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 4/5 }
          - { os: ubuntu-latest, python: "3.13", shard: 5/5 }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python ${{ matrix.python }} # NOSONAR - installs sharpit from source for coverage; --no-build would prevent that
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python scripts/ci/timing_files.py "${{ runner.temp }}" # budgets.args, no-budgets.args
      # coverage's per-worker data files would land in the repo, which the side-effect checks report as a change
      - env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          COVERAGE_CORE: sysmon # sys.monitoring tracer (Python 3.12+): same report, a fraction of the classic tracer's cost
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
        run: uv run python -m pytest -q -n auto --cov=sharpit --cov-report= -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
      - run: cp "$RUNNER_TEMP/.coverage" "coverage-${{ strategy.job-index }}.data" # a visible name: upload skips dotfiles
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with:
          name: junit-coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: coverage-${{ strategy.job-index }}.data
          retention-days: 1
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-coverage-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7

      # The budget tests alone (-n 0) after the parallel step: next to xdist workers still draining they fail on CI
      # only. The coverage run above keeps these files (their ordinary tests are coverage input; the tracer skips only
      # the budget assertions), so they run again here, unmeasured: no coverage, no SHARPIT_SHARD.
      - if: ${{ !cancelled() && (matrix.shard == '5/5') }}
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead-budgets.jsonl
        run: uv run --no-sync python -m pytest -q -n 0 "@${{ runner.temp }}/budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft-budgets.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb-budgets.json" --junitxml="${{ runner.temp }}/junit-budgets.xml"
      - id: scan-junit-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-budgets.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-budgets.outcome == 'success'
        with:
          name: junit-coverage-shard-budgets
          path: ${{ runner.temp }}/junit-budgets.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead-budgets.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead-budgets.outcome == 'success'
        with:
          name: overhead-coverage-shard-budgets
          path: ${{ runner.temp }}/overhead-budgets.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed-budgets.outcome == 'success'
        with:
          name: speed-coverage-shard-budgets
          path: ${{ runner.temp }}/speed/*-budgets.*
          if-no-files-found: ignore
          retention-days: 7

  lint:
    # ruff, format, pyright, the mirror-link grep, the workflow linters and the sharpit gate dogfood: one job (each
    # was 11-23 s of work on its own runner; pyright pins 3.12), in parallel with the shards, off their critical path.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.12 # NOSONAR - installs sharpit from source; pyright resolves it
      - run: uv run --no-sync ruff check
      - run: "! git grep -n 'cloud[n]s' -- ." # links must point at github.com, never a mirror
        shell: bash
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyright
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor@1.32.0 --offline --min-severity medium .github/workflows
      # Dogfood: the example's fixed route must pass `pytest --sharpit`, its planted N+1 must fail it.
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python -m pytest examples/fastapi_sqla/tests_gate -k fixed --sharpit --sharpit-junit=sharpit-junit.xml -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft-fixed.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb-fixed.json" --junitxml="${{ runner.temp }}/junit-fixed.xml"
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit-fixed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-fixed.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-fixed.outcome == 'success'
        with:
          name: junit-lint-sharpit-gate-fixed
          path: ${{ runner.temp }}/junit-fixed.xml
          retention-days: 7
      - id: scan-sharpit-gate-reports
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" sharpit-report.json sharpit-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-sharpit-gate-reports.outcome == 'success'
        with:
          name: sharpit-gate-reports
          path: |
            sharpit-report.json
            sharpit-junit.xml
          retention-days: 7
      - name: The planted N+1 must fail the gate
        run: "! uv run --no-sync python -m pytest examples/fastapi_sqla/tests_gate -k n_plus_one --sharpit --sharpit-report=planted-report.json -p scripts.pytest_speed.fixture_timer --fixture-times=\"$RUNNER_TEMP/speed/ft-planted.jsonl\" -p scripts.pytest_speed.rebuild_log --rebuild-log=\"$RUNNER_TEMP/speed/rb-planted.json\" --junitxml=\"$RUNNER_TEMP/junit-planted.xml\""
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit-planted
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-planted.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-planted.outcome == 'success'
        with:
          name: junit-lint-sharpit-gate-planted
          path: ${{ runner.temp }}/junit-planted.xml
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-lint-sharpit-gate
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-lint-sharpit-gate
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7

  # The locked-deps Ubuntu 3.12 and 3.14 legs: push (main, mvp, release/**) and workflow_dispatch, never a pull request.
  # Steps identical to test-shard's (tests/test_ci_layout.py compares them); only the rows and the event gate differ.
  test-shard-locked:
    name: test shard (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", shard: 1/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 2/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 3/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 4/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 1/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 2/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 3/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 4/4 }
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra test ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--group full-extras' || '' }} --python ${{ matrix.python }} # NOSONAR - installs sharpit from source for the test suite; --no-build would prevent that
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python scripts/ci/timing_files.py "${{ runner.temp }}" # budgets.args, no-budgets.args
      - run: uv run python -m pytest -q -n auto "@${{ runner.temp }}/no-budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with: # per-file timings: pytest-speed's `rank` and the shard weights (tests/shard_weights.json) read these
          name: junit-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-test-shard-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7
      # The budget tests alone (-n 0) after the parallel step, which ignores them: next to xdist workers still
      # draining they fail on CI only. No SHARPIT_SHARD (each runs once, here) and no coverage (the tracer skips them).
      - if: ${{ !cancelled() && (matrix.shard == '4/4' || matrix.shard == '6/6') }}
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead-budgets.jsonl
        run: uv run --no-sync python -m pytest -q -n 0 "@${{ runner.temp }}/budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft-budgets.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb-budgets.json" --junitxml="${{ runner.temp }}/junit-budgets.xml"
      - id: scan-junit-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-budgets.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-budgets.outcome == 'success'
        with:
          name: junit-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/junit-budgets.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead-budgets.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead-budgets.outcome == 'success'
        with:
          name: overhead-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/overhead-budgets.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed-budgets.outcome == 'success'
        with:
          name: speed-test-shard-${{matrix.os}}-${{matrix.python}}-budgets
          path: ${{ runner.temp }}/speed/*-budgets.*
          if-no-files-found: ignore
          retention-days: 7

  test:
    # The required checks keep their names: each passes only when every test shard passed (always(): a skipped
    # required check would count as green). Stricter than per leg: one failed shard, or lint, fails all four.
    # The 3.13 leg is coverage-shard (it runs the suite once, under coverage). The locked Ubuntu 3.12 and 3.14 legs
    # (test-shard-locked) run on push only: on a pull request every check here passes with a note, on a push they gate.
    needs: [test-shard, test-shard-locked, coverage-shard, lint, changes]
    if: always()
    strategy:
      fail-fast: false # each required check reports, none shows as cancelled
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.test-shard.result }}" = success
          test "${{ needs.coverage-shard.result }}" = success
          test "${{ needs.lint.result }}" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "Pull request: the locked-deps Ubuntu 3.12 and 3.14 legs run on push to main, mvp and release/**, not here."
            exit 0
          fi
          test "${{ needs.test-shard-locked.result }}" = success

  coverage:
    # Required check, fails unless every coverage shard passed; combines their data into coverage.xml for people.
    # sonar combines the same data itself, so it never waits for this job.
    needs: [coverage-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; coverage check is a no-op."
      - if: needs.changes.outputs.code != 'false'
        run: test "${{ needs.coverage-shard.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code != 'false'
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked --extra test --python 3.13 # NOSONAR - the report reads sharpit's sources and coverage's config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - if: needs.changes.outputs.code != 'false'
        run: uv run --no-sync coverage combine coverage-*.data && uv run --no-sync coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  sonar:
    # Combines the coverage leg's data itself (one job, no handoff), then the quality gate (sonar.qualitygate.wait)
    # and the ratchet: both stay in this required check, so a PR cannot merge until both pass.
    needs: [coverage-shard, changes]
    runs-on: ubuntu-latest
    # always(): report change-detection and coverage failures in this required check too.
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; Sonar check is a no-op."
      - if: needs.changes.outputs.code != 'false'
        run: test "${{ needs.coverage-shard.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
          fetch-depth: 0 # blame and new-code detection need full history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code != 'false'
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - if: needs.changes.outputs.code != 'false'
        run: uv sync --locked --extra test --python 3.13 # NOSONAR - the report reads sharpit's sources and coverage's config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - if: needs.changes.outputs.code != 'false'
        run: uv run --no-sync coverage combine coverage-*.data && uv run --no-sync coverage xml
      - name: Read project version
        id: version
        if: needs.changes.outputs.code != 'false'
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/sharpit/__init__.py').read()).group(1))")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check SonarCloud availability
        id: health
        if: needs.changes.outputs.code != 'false'
        run: |
          if curl -sf -m 10 https://sonarcloud.io/api/system/status | grep -q '"status":"UP"'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarCloud is unreachable; scan skipped for this run (not a code failure)."
          fi
      - name: Cache the Sonar scanner (JRE and analyzers)
        if: >-
          needs.changes.outputs.code != 'false' && steps.health.outputs.up == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: # zizmor: ignore[cache-poisoning]
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-v8.4.1 # the scan action's version: a new pin downloads a fresh scanner
      - name: SonarCloud scan
        if: >-
          needs.changes.outputs.code != 'false' && steps.health.outputs.up == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Sonar ratchet (no new issues; main never above sonar-baseline.txt)
        if: >-
          needs.changes.outputs.code != 'false' && steps.health.outputs.up == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            python scripts/ci/sonar_ratchet.py --pull-request "$PR"
          else
            python scripts/ci/sonar_ratchet.py --branch "$GITHUB_REF_NAME"
          fi

  lowest-shard:
    name: lowest shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --extra test --no-dev --resolution lowest-direct --python 3.12 # NOSONAR - deliberately resolves lowest-direct without the lock and installs sharpit from source
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python scripts/ci/timing_files.py "${{ runner.temp }}" # budgets.args, no-budgets.args
      # --no-sync: a plain `uv run` re-syncs to uv.lock and undoes the lowest resolution
      - run: uv run --no-sync python -m pytest -q -n auto "@${{ runner.temp }}/no-budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with:
          name: junit-lowest-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-lowest-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-lowest-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7
      # The budget tests alone (-n 0) after the parallel step, which ignores them: next to xdist workers still
      # draining they fail on CI only. No SHARPIT_SHARD (each runs once, here) and no coverage (the tracer skips them).
      - if: ${{ !cancelled() && (matrix.shard == '4/4') }}
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead-budgets.jsonl
        run: uv run --no-sync python -m pytest -q -n 0 "@${{ runner.temp }}/budgets.args" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft-budgets.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb-budgets.json" --junitxml="${{ runner.temp }}/junit-budgets.xml"
      - id: scan-junit-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit-budgets.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-budgets.outcome == 'success'
        with:
          name: junit-lowest-shard-budgets
          path: ${{ runner.temp }}/junit-budgets.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead-budgets.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead-budgets.outcome == 'success'
        with:
          name: overhead-lowest-shard-budgets
          path: ${{ runner.temp }}/overhead-budgets.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed-budgets
        if: always()
