name: ci
on:
  push:
    branches: [main, mvp]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # ruff, format, pyright and the mirror-link grep are version-independent (pyright pins 3.12): one job, in parallel
    # with the test shards, so no shard carries lint on its critical path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.12 # NOSONAR - installs sharpit from source; pyright resolves it
      - run: uv run --no-sync ruff check
      - run: "! git grep -n 'cloud[n]s' -- ." # links must point at github.com, never a mirror
        shell: bash
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyright

  # The suite runs split by test file (SHARPIT_SHARD=i/n, tests/_shard.py): 4 shards a leg, because the costliest shard
  # sets the leg's wall (the ceiling is pinned in tests/test_ci_layout.py).
  # Each leg's shards together run every test exactly once (tests/test_shard.py).
  test-shard:
    name: test shard (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", shard: 1/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 2/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 3/4 }
          - { os: ubuntu-latest, python: "3.12", shard: 4/4 }
          - { os: ubuntu-latest, python: "3.13", shard: 1/4 }
          - { os: ubuntu-latest, python: "3.13", shard: 2/4 }
          - { os: ubuntu-latest, python: "3.13", shard: 3/4 }
          - { os: ubuntu-latest, python: "3.13", shard: 4/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 1/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 2/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 3/4 }
          - { os: ubuntu-latest, python: "3.14", shard: 4/4 }
          - { os: windows-latest, python: "3.14", shard: 1/4 }
          - { os: windows-latest, python: "3.14", shard: 2/4 }
          - { os: windows-latest, python: "3.14", shard: 3/4 }
          - { os: windows-latest, python: "3.14", shard: 4/4 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra test --python ${{ matrix.python }} # NOSONAR - installs sharpit from source for the test suite; --no-build would prevent that
      - run: uv run pytest -q -n auto --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: # per-file timings: pytest-speed's `rank` and the shard weights (tests/shard_weights.json) read these
          name: junit-${{ matrix.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - name: overhead budgets (also in the job summary, which needs a sign-in to read)
        if: always()
        shell: bash
        env:
          PYTHONUTF8: 1 # the units hold µ; Windows would print cp1252
        run: |
          uv run --no-sync python -c "import json,sys
          for r in map(json.loads, open(sys.argv[1])):
              s, u = r['scale'], r['unit']
              print(f\"{r['verdict']:4} {r['name']}: overhead {r['overhead']/s:.3f} {u}, noise {r['noise']/s:.3f}, budget {r['budget']/s:.3f}\")" "$RUNNER_TEMP/overhead.jsonl" || true

  test:
    # The required checks keep their names: each passes only when every test shard passed (always(): a skipped
    # required check would count as green). Stricter than per leg: one failed shard, or lint, fails all four.
    needs: [test-shard, lint]
    if: always()
    strategy:
      fail-fast: false # each required check reports, none shows as cancelled
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success && test "${{ needs.lint.result }}" = success

  coverage-shard:
    # Coverage for SonarCloud. Overhead budget tests time capture on vs off, which the coverage tracer distorts:
    # tests/overhead.py::paired skips every one of them while a tracer runs; the plain test matrix above enforces them.
    name: coverage shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.13 # NOSONAR - installs sharpit from source for coverage; --no-build would prevent that
      # coverage's per-worker data files would land in the repo, which the side-effect checks report as a change
      - env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          COVERAGE_CORE: sysmon # sys.monitoring tracer (Python 3.12+): same report, a fraction of the classic tracer's cost
          SHARPIT_SHARD: ${{ matrix.shard }}
        run: uv run pytest -q -n auto --cov=sharpit --cov-report=
      - run: cp "$RUNNER_TEMP/.coverage" "coverage-${{ strategy.job-index }}.data" # a visible name: upload skips dotfiles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: coverage-${{ strategy.job-index }}.data
          retention-days: 1

  coverage:
    # Combines the shards' data into the coverage.xml sonar reads; required check, fails unless every shard passed.
    needs: coverage-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.coverage-shard.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.13 # NOSONAR - the report reads sharpit's sources and coverage's config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: uv run --no-sync coverage combine coverage-*.data && uv run --no-sync coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  sonar:
    needs: coverage
    runs-on: ubuntu-latest
    # Forked PRs and Dependabot runs get no SONAR_TOKEN; scan trusted pushes and internal PRs only.
    # always(): when coverage fails, sonar must fail too, not skip (a skipped required check counts as green).
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - run: test "${{ needs.coverage.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame and new-code detection need full history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml
      - name: Read project version
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/sharpit/__init__.py').read()).group(1))")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check SonarCloud availability
        id: health
        run: |
          if curl -sf -m 10 https://sonarcloud.io/api/system/status | grep -q '"status":"UP"'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarCloud is unreachable; scan skipped for this run (not a code failure)."
          fi
      - name: SonarCloud scan
        if: steps.health.outputs.up == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Sonar ratchet (no new issues; main never above sonar-baseline.txt)
        if: steps.health.outputs.up == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then
            python scripts/ci/sonar_ratchet.py --pull-request "$PR"
          else
            python scripts/ci/sonar_ratchet.py --branch "$GITHUB_REF_NAME"
          fi

  lowest-shard:
    name: lowest shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --extra test --no-dev --resolution lowest-direct --python 3.12 # NOSONAR - deliberately resolves lowest-direct without the lock and installs sharpit from source
      # --no-sync: a plain `uv run` re-syncs to uv.lock and undoes the lowest resolution
      - run: uv run --no-sync pytest -q -n auto
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - name: overhead budgets (also in the job summary, which needs a sign-in to read)
        if: always()
        shell: bash
        env:
          PYTHONUTF8: 1 # the units hold µ; Windows would print cp1252
        run: |
          uv run --no-sync python -c "import json,sys
          for r in map(json.loads, open(sys.argv[1])):
              s, u = r['scale'], r['unit']
              print(f\"{r['verdict']:4} {r['name']}: overhead {r['overhead']/s:.3f} {u}, noise {r['noise']/s:.3f}, budget {r['budget']/s:.3f}\")" "$RUNNER_TEMP/overhead.jsonl" || true

  lowest:
    # required check: passes only when every lowest shard passed (always(): a skipped required check counts as green)
    needs: lowest-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lowest-shard.result }}" = success

  no-sqlalchemy-shard:
    # SQLAlchemy is optional: sharpit must install, import and serve every panel without it
    name: no-sqlalchemy shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: >-
          uv sync --locked --extra test --no-install-package sqlalchemy --no-install-package aiosqlite
          --no-install-package alembic --no-install-package greenlet # NOSONAR - this job installs sharpit from source and excludes optional dependencies
      - run: uv run --no-sync pytest -q -n auto -m "not needs_sqlalchemy"
        env:
          SHARPIT_SHARD: ${{ matrix.shard }}

  no-sqlalchemy:
    # required check: passes only when every no-sqlalchemy shard passed (always(): a skipped required check counts as green)
    needs: no-sqlalchemy-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.no-sqlalchemy-shard.result }}" = success

  masking-gates:
    # The two masking gates that outweigh any shard ceiling alone, every row: test_masking_scales_linearly.py (487 s of
    # CPU time on Linux) and test_statement_surfaces.py (386 s on Windows). The shards leave them out (tests/_shard.py
    # OWN_JOB) and this job runs them whole. No job timeout is set, so GitHub's 6 h default covers both.
    name: masking gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked --extra test --python 3.14 # NOSONAR - installs sharpit from source for the gate
      - run: uv run --no-sync pytest tests/masking/test_masking_scales_linearly.py tests/masking/test_statement_surfaces.py -q -n auto --junitxml="${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: # ci_review.py globs junit-*
          name: junit-gates-${{ matrix.os }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7

  masking-gates-check:
    # required check, as `test` is for the shards (always(): a skipped required check counts as green)
    needs: masking-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.masking-gates.result }}" = success

  live:
    # The live profile (tests/live, --live): real MySQL, MariaDB and PostgreSQL servers started by Testcontainers. Linux
    # only: GitHub's Windows runners cannot run Linux containers. A skip is a failure: the check reads the report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked --extra test --python 3.14 # NOSONAR - installs sharpit from source for the live tests
      - run: uv run --no-sync pytest tests/live --live -n 0 --junitxml=live.xml
      - name: Require executed live tests, without skips
        if: always()
        run: uv run --no-sync python scripts/ci/check_live_tests.py live.xml --require test_a_server_answers=4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: # ci_review.py globs junit-*
          name: junit-live
          path: live.xml
          retention-days: 7

  sharpit-gate:
    # Dogfood: the example's fixed route must pass `pytest --sharpit`, its planted N+1 must fail it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv sync --locked --extra test --python 3.13 # NOSONAR - installs sharpit from source for the gate
      - run: uv run --no-sync pytest examples/fastapi_sqla/tests_gate -k fixed --sharpit --sharpit-junit=sharpit-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sharpit-gate-reports
          path: |
            sharpit-report.json
            sharpit-junit.xml
          retention-days: 7
      - name: The planted N+1 must fail the gate
        run: "! uv run --no-sync pytest examples/fastapi_sqla/tests_gate -k n_plus_one --sharpit --sharpit-report=planted-report.json"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run build
      - run: git diff --exit-code -- ../src/sharpit/ui/static

  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm test

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: main never tracks .superpowers/ (harvest into docs/reports/ first)
        if: github.base_ref == 'main'
        run: python3 scripts/ci/no_superpowers.py
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/sharpit-*.whl fastapi pydantic-settings uvicorn httpx
          PYTHONPATH=. "$RUNNER_TEMP/smoke/bin/python" scripts/ci/wheel_smoke.py
