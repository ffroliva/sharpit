      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit-budgets.outcome == 'success'
        with:
          name: junit-no-sqlalchemy-shard-budgets
          path: ${{ runner.temp }}/junit-budgets.xml
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-overhead-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead-budgets.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead-budgets.outcome == 'success'
        with:
          name: overhead-no-sqlalchemy-shard-budgets
          path: ${{ runner.temp }}/overhead-budgets.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed-budgets
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed-budgets.outcome == 'success'
        with:
          name: speed-no-sqlalchemy-shard-budgets
          path: ${{ runner.temp }}/speed/*-budgets.*
          if-no-files-found: ignore
          retention-days: 7

  no-sqlalchemy:
    # required check: passes only when every no-sqlalchemy shard passed (always(): a skipped required check counts as green)
    needs: [no-sqlalchemy-shard, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.no-sqlalchemy-shard.result }}" = success

  masking-gates:
    # The four files that outweigh any shard ceiling alone, every row: test_masking_scales_linearly.py (487 s of CPU
    # time on Linux), test_statement_surfaces.py (386 s on Windows), test_lane_gate.py (418 s on Windows) and
    # test_gates_bite.py (488 s on Windows, 279 s on Linux). The shards leave them out (tests/_shard.py OWN_JOB) and
    # this job runs them whole. No job timeout is set, so GitHub's 6 h default covers them.
    # Owner decision (2026-11-11, overriding pytest-speed's "no shards as the fix"): one job per gate file group on
    # both OSes, since what is left is work the tests need. Split by file in the matrix, never by an environment variable:
    # the gates' own nested pytest runs inherit os.environ. Ceiling per row: tests/test_ci_layout.py GATE_SECONDS.
    name: masking gates (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, part: gates-bite, files: "tests/masking/test_gates_bite.py" }
          - { os: windows-latest, part: scales, files: "tests/masking/test_masking_scales_linearly.py" }
          - { os: windows-latest, part: surfaces-lane, files: "tests/masking/test_statement_surfaces.py tests/scripts/test_lane_gate.py" }
          - { os: ubuntu-latest, part: gates-bite, files: "tests/masking/test_gates_bite.py" }
          - { os: ubuntu-latest, part: scales, files: "tests/masking/test_masking_scales_linearly.py" }
          - { os: ubuntu-latest, part: surfaces-lane, files: "tests/masking/test_statement_surfaces.py tests/scripts/test_lane_gate.py" }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked --extra test ${{ matrix.os == 'ubuntu-latest' && '--group full-extras' || '' }} --python 3.14 # NOSONAR - installs sharpit from source for the gate
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python -m pytest ${{ matrix.files }} -q -n auto -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with: # ci_review.py globs junit-*
          name: junit-masking-gates-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-masking-gates-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-masking-gates-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7

  masking-gates-check:
    # required check, as `test` is for the shards (always(): a skipped required check counts as green)
    needs: [masking-gates, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.masking-gates.result }}" = success

  ui:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; UI check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false' && hashFiles('ui/package.json') != ''
        with: # zizmor: ignore[cache-poisoning]
          node-version: 22
      - if: needs.changes.outputs.code != 'false' && hashFiles('ui/package.json') != ''
        run: npm ci --ignore-scripts && npm run build
        working-directory: ui
      - if: needs.changes.outputs.code != 'false' && hashFiles('ui/package.json') != ''
        run: git diff --exit-code -- src/sharpit/ui/static

  vitest:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; Vitest check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false' && hashFiles('ui/package.json') != ''
        with: # zizmor: ignore[cache-poisoning]
          node-version: 22
      - if: needs.changes.outputs.code != 'false' && hashFiles('ui/package.json') != ''
        run: npm ci --ignore-scripts && npm test
        working-directory: ui

  wheel:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: always()
        run: test "${{ needs.changes.result }}" = success
      - if: needs.changes.outputs.code == 'false'
        run: echo "Docs-only change; wheel check is a no-op."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - name: main never tracks .superpowers/ (harvest into docs/reports/ first)
        if: needs.changes.outputs.code != 'false' && github.base_ref == 'main'
        run: python3 scripts/ci/no_superpowers.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.code != 'false'
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true # uv's download and wheel cache, keyed on uv.lock
      - if: needs.changes.outputs.code != 'false'
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - if: needs.changes.outputs.code != 'false'
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/sharpit-*.whl fastapi pydantic-settings uvicorn httpx
          PYTHONPATH=. "$RUNNER_TEMP/smoke/bin/python" scripts/ci/wheel_smoke.py

  live:
    name: live (${{ matrix.server }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: mysql84, image: mysql:8.4.10, port: 3306, filter: "mysql84 and not wrong_wired or wrong_wired", legs: "mysql84-default=2150 mysql84-NO_BACKSLASH_ESCAPES=2150 mysql84-ANSI_QUOTES=1388", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_a_wrong_wired_dialect_fails_the_oracle=1" }
          - { server: mysql80, image: mysql:8.0.44, port: 3306, filter: mysql80, legs: "mysql80-default=1995 mysql80-NO_BACKSLASH_ESCAPES=1995 mysql80-ANSI_QUOTES=1233", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row" }
          - { server: mariadb, image: mariadb:12.3.3, port: 3306, filter: "mariadb or oracle_control and backslash and mysql or oracle_control and mssql", legs: "mariadb-default=1996 mariadb-NO_BACKSLASH_ESCAPES=1996 mariadb-ANSI_QUOTES=1233 mariadb-MSSQL=1403 mariadb-ORACLE=1233", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_oracle_control=3" }
          - { server: postgresql, image: postgres:18.2, port: 5432, filter: "postgresql or scs_off_no_cut or inverse_plant", legs: "postgresql-on=138 postgresql-off=138", required: "test_a_server_answers=1 test_a_refused_statement_keeps_its_value_hidden=1 test_oracle_row test_oracle_control=3 test_example_app_records_its_server_family=1 test_the_inverse_plant_shows_five_rows_on_off=1" }
          - { server: controls, image: mysql:8.4.10, port: 3306, filter: "sqlite or test_example_app_records_its_server_family and mysql", legs: "sqlite-default=2817", required: "test_example_app_records_its_server_family=1 test_a_refused_statement_keeps_its_value_hidden=1" }
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: ${{ matrix.image }}
        options: >-
          --health-cmd "${{ matrix.server == 'mariadb' && 'healthcheck.sh --connect --innodb_initialized' || matrix.server == 'postgresql' && 'pg_isready -U postgres' || 'mysqladmin ping -h 127.0.0.1 -psharpit' }}"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: sharpit
          MYSQL_DATABASE: sharpit
          MARIADB_ROOT_PASSWORD: sharpit
          MARIADB_DATABASE: sharpit
          POSTGRES_PASSWORD: sharpit
          POSTGRES_DB: sharpit
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: # zizmor: ignore[cache-poisoning]
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --extra test --group full-extras --python 3.14 # NOSONAR - installs sharpit from source and every live driver
      - run: uv run --no-sync python -c "import os, sys; os.makedirs(sys.argv[1], exist_ok=True)" "${{ runner.temp }}/speed" # the speed plugins write here
      - run: uv run --no-sync python -m pytest tests/live --live -n auto -k "$LIVE_FILTER" -p scripts.pytest_speed.fixture_timer --fixture-times="${{ runner.temp }}/speed/ft.jsonl" -p scripts.pytest_speed.rebuild_log --rebuild-log="${{ runner.temp }}/speed/rb.json" --junitxml="${{ runner.temp }}/junit.xml"
        env:
          LIVE_FILTER: ${{ matrix.filter }}
          SHARPIT_OVERHEAD_LOG: ${{ runner.temp }}/overhead.jsonl
          SHARPIT_LIVE_MYSQL84_URL: ${{ (matrix.server == 'mysql84' || matrix.server == 'controls') && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_MYSQL80_URL: ${{ matrix.server == 'mysql80' && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_MARIADB_URL: ${{ matrix.server == 'mariadb' && format('mysql+pymysql://root:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
          SHARPIT_LIVE_POSTGRESQL_URL: ${{ matrix.server == 'postgresql' && format('postgresql+psycopg://postgres:sharpit@127.0.0.1:{0}/sharpit', matrix.port) || '' }}
      - name: Require executed live tests, without skips
        if: always()
        env:
          LEGS: ${{ matrix.legs }}
          REQUIRED_LIVE: ${{ matrix.required }}
        run: |
          read -r -a legs <<< "$LEGS"
          read -r -a required <<< "$REQUIRED_LIVE"
          uv run --no-sync python scripts/ci/check_live_tests.py "$RUNNER_TEMP/junit.xml" --legs "${legs[@]}" --require "${required[@]}"
      - id: scan-junit
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-junit.outcome == 'success'
        with:
          name: junit-live-${{ matrix.server }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
      - id: scan-overhead
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/overhead.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-overhead.outcome == 'success'
        with:
          name: overhead-live-${{ matrix.server }}
          path: ${{ runner.temp }}/overhead.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - id: scan-speed
        if: always()
        run: uv run --no-sync python scripts/ci/artifact_scan.py --values-file "${{ runner.temp }}/sharpit-canary.txt" "${{ runner.temp }}/speed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan-speed.outcome == 'success'
        with: # pytest-speed fixture times and rebuild counts (per xdist worker: *.gw*), for `first-cost`
          name: speed-live-${{ matrix.server }}
          path: ${{ runner.temp }}/speed
          if-no-files-found: ignore
          retention-days: 7

  live-check:
    needs: [live, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE_CHANGED" = false ]; then exit 0; fi
          test "${{ needs.live.result }}" = success
