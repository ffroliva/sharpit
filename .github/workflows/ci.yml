name: ci
on:
  push:
    branches: [master, mvp]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra test --python ${{ matrix.python }}
      - run: uv run ruff check
      - run: "! git grep -n 'cloud[n]s' -- ." # links must point at github.com, never a mirror
        shell: bash
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q -n auto

  coverage:
    # Coverage for SonarCloud. The overhead budget test times capture on vs off, which the coverage
    # tracer distorts; it runs in the plain test matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra test --python 3.13
      - run: >-
          uv run pytest -q -n auto --cov=sharpit --cov-report=xml
          --deselect tests/fastapi/test_capture_overhead.py::test_request_overhead_budget
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

  sonar:
    needs: coverage
    runs-on: ubuntu-latest
    # Forked PRs and Dependabot runs get no SONAR_TOKEN; scan trusted pushes and internal PRs only.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # blame and new-code detection need full history
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Check SonarCloud availability
        id: health
        run: |
          if curl -sf -m 10 https://sonarcloud.io/api/system/status | grep -q '"status":"UP"'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarCloud is unreachable; scan skipped for this run (not a code failure)."
          fi
      - name: SonarCloud scan
        if: steps.health.outputs.up == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra test --no-dev --resolution lowest-direct --python 3.12
      # --no-sync: a plain `uv run` re-syncs to uv.lock and undoes the lowest resolution
      - run: uv run --no-sync pytest -q -n auto

  no-sqlalchemy:
    # SQLAlchemy is optional: sharpit must install, import and serve every panel without it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: >-
          uv sync --extra test --no-install-package sqlalchemy --no-install-package aiosqlite
          --no-install-package alembic --no-install-package greenlet
      - run: uv run --no-sync pytest -q -n auto -m "not needs_sqlalchemy"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: git diff --exit-code -- ../src/sharpit/ui/static

  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/sharpit-*.whl fastapi pydantic-settings uvicorn httpx
          PYTHONPATH=. "$RUNNER_TEMP/smoke/bin/python" scripts/ci/wheel_smoke.py
