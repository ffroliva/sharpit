[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharpit"
dynamic = ["version"]
description = "Local developer console and pytest gate for FastAPI apps, a Python port of BootUI by Julien Dubois."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Flavio Oliva" }]
keywords = ["fastapi", "starlette", "developer-tools", "devtools", "debugging", "introspection", "mcp", "bootui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = ["starlette>=0.44", "packaging>=23"]

[project.entry-points.pytest11]
sharpit = "sharpit.pytest_plugin"

[project.urls]
Homepage = "https://github.com/ffroliva/sharpit"
Source = "https://github.com/ffroliva/sharpit"
Issues = "https://github.com/ffroliva/sharpit/issues"
Changelog = "https://github.com/ffroliva/sharpit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
settings = ["pydantic-settings>=2.4"]
test = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "sqlalchemy[asyncio]>=2.0.38",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",  # A-postgresql: leased-database tests (spec §6.1 item 9)
    "pymysql>=1.1",  # 0.5.0 F5b/A-mysql: leased MySQL tests (spec §4.5)
    "alembic>=1.13",
    "jsonschema>=4.21",
    "pytest-asyncio>=0.24",
    "pytest-rerunfailures>=14",
    "hypothesis>=6.100",  # the property tests of the SQL output architecture
    "testcontainers>=4.8",  # the live profile (tests/live): the generic DockerContainer, so no sqlalchemy extras
    "opentelemetry-sdk>=1.26",  # A12 resolver rows use the real ReadableSpan shape
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pydantic-settings>=2.4"]
full-extras = [
    "asyncpg>=0.30",
    "aiomysql>=0.2",
]

[tool.hatch.version]
path = "src/sharpit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpit"]
include = ["src/sharpit/**"]  # covers src/sharpit/ui/static/**

[tool.hatch.build.targets.sdist]
# the sdist carries the package, tests and the example; agent workflows, research and UI sources stay in git
exclude = [
    "/.superpowers",
    "/.claude",
    "/.github",
    "/replica",
    "/skills",
    "/docs/superpowers",
    "/ui",
    "/design",
    "/tests/design",
    "/scripts",
    "/pytest-speed.toml",
    "/uv.lock",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/GEMINI.md",
    "/mempalace.yaml",
    "/tests/test_ui_no_html.py",  # reads ui/src, which is not shipped
    "/tests/test_agent_workflow.py",  # reads skills/ and docs/, which are not shipped
    "/tests/scripts",  # tests the repo scripts/, which are not shipped
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["scripts/pytest_speed"]  # vendored verbatim; its VERSION hash catches local edits

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PERF", "C4", "FURB", "PT018"]  # PERF/C4/FURB: performance; PT018: one condition per assert

[tool.ruff.lint.per-file-ignores]
# S (security) guards what ships. Tests assert and use fake secrets by design; scripts and examples are not shipped.
"tests/**" = ["S"]
"scripts/**" = ["S"]
"examples/**" = ["S"]
"src/sharpit/engine/masking.py" = ["S105"]  # regex fragments named *_TOKEN_*, not passwords
"src/sharpit/engine/collectors/postgresql/queries.py" = ["S608"]  # constants; relation must match _RELATION_NAME
"src/sharpit/engine/collectors/vulns/osv.py" = ["S310"]  # settings allow only http and https base URIs
"src/sharpit/engine/collectors/vulns/epss.py" = ["S310"]  # as osv.py

[tool.pyright]
include = ["src/sharpit"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # examples/ (the sample app) imports as a package
timeout = 60
junit_logging = "no"
markers = [
    "bootui: tracker row key this test is evidence for",
    "needs_sqlalchemy: needs SQLAlchemy, aiosqlite or greenlet installed (the no-sqlalchemy CI job deselects it)",
    "live: runs against a real database server (tests/live, collected only with --live)",
]

[tool.coverage.run]
# the pytest plugin tests run pytest in a subprocess (pytester.runpytest_subprocess); measure those too
patch = ["subprocess"]
# a planted build copies src/sharpit under pytest's temp dir (tests/masking/a10/conftest.py: scratch_package);
# its subprocess imports that copy as sharpit, and the combine job, on another runner, has no such file
omit = ["*/pytest-of-*/*"]
